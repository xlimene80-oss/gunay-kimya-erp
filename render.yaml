services:
  # -------------------------------------------------------------
  # 1. Backend API Service (FastAPI / Python)
  # -------------------------------------------------------------
  - type: web
    name: gunay-kimya-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://gunay-kimya-web.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9

  # -------------------------------------------------------------
  # 2. Frontend Web Application (React / Vite / Static Site)
  # -------------------------------------------------------------
  - type: web
    name: gunay-kimya-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://gunay-kimya-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
