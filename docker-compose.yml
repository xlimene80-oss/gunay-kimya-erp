services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gunay_kimya_erp_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Gunay Kimya ERP Backend
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gunay_kimya_erp}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gunay-kimya-network

  db:
    image: postgres:16-alpine
    container_name: gunay_kimya_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gunay_kimya_erp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gunay_kimya_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gunay-kimya-network

networks:
  gunay-kimya-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
